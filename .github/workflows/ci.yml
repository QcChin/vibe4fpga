name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── TypeScript lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

  # ── VSCode extension e2e ─────────────────────────────────────────────────────
  extension-test:
    name: VSCode Extension E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run build

      # @vscode/test-electron downloads a real VSCode instance and runs the
      # extension host in it. On Linux a virtual display is required.
      - name: Run e2e tests (headless via Xvfb)
        run: xvfb-run -a npm test --workspace=packages/vscode-extension

  # ── Python package unit tests ────────────────────────────────────────────────
  python-test:
    name: Python — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - llm-router
          - mcp-servers/fpga-project-mcp
          - mcp-servers/eda-bridge-mcp
          - mcp-servers/waveform-mcp
          - mcp-servers/instrument-mcp
          - mcp-servers/datasheet-mcp
          - mcp-servers/quartus-mcp
          - mcp-servers/yosys-mcp
          - collab-server
          - skills

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync
        working-directory: packages/${{ matrix.package }}

      - name: Run pytest
        shell: bash
        working-directory: packages/${{ matrix.package }}
        run: |
          uv run pytest --tb=short -q || EXIT_CODE=$?
          # pytest exit 5 = no tests collected; treat as success
          if [ "${EXIT_CODE:-0}" -eq 5 ]; then
            echo "::notice::No tests collected in packages/${{ matrix.package }} — skipping"
            exit 0
          fi
          exit "${EXIT_CODE:-0}"
