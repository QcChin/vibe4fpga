[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waveform-mcp"
version = "0.1.0"
description = "Simulation Waveform Parsing MCP Server (VCD/FST/WLF)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.6.0",
    "vcdvcd>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
waveform-mcp = "waveform_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/waveform_mcp"]
