[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instrument-mcp"
version = "0.1.0"
description = "Measurement Instrument Access MCP Server (oscilloscope / spectrum analyzer)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.6.0",
    "pyvisa>=1.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
instrument-mcp = "instrument_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/instrument_mcp"]
