mcp_name:  verify-mcp
binary:    verify-mcp
transport: stdio
env:
  required: []
  optional:
    - VIBE4FPGA_LLM         # default model key (claude / gpt-4o / ollama / ...)
    - ANTHROPIC_API_KEY     # Claude, direct api.anthropic.com (x-api-key)
    - ANTHROPIC_AUTH_TOKEN  # Claude, Bearer-token proxy / OAuth (alt to API_KEY)
    - ANTHROPIC_BASE_URL    # Claude, override endpoint (for proxies)
    - OPENAI_API_KEY        # required if VIBE4FPGA_LLM=openai or =deepseek
    - OPENAI_BASE_URL       # OpenAI, override endpoint (for third-party aggregators)
skills:
  - id: testbench_gen
    tool: generate_testbench
    summary: "Generate a self-checking SystemVerilog testbench for the supplied RTL module with optional coverage goals and simulator hints."
    claude_trigger: "testbench|tb|cover|sim driver"
    opencode_command: gen-tb
    codex_alias: tb
  - id: verification
    tool: score_verification
    summary: "Score a verification run across 5 stages (lint / sim / formal / synth / spec) and emit a Markdown narrative report."
    claude_trigger: "verify|score|verification report"
    opencode_command: score-verify
    codex_alias: sv
