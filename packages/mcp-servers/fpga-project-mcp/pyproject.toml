[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpga-project-mcp"
version = "0.1.0"
description = "FPGA Project Indexing MCP Server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.6.0",
    "networkx>=3.2.0",
    "pygments>=2.17.0",
    "sentence-transformers>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
fpga-project-mcp = "fpga_project_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fpga_project_mcp"]
