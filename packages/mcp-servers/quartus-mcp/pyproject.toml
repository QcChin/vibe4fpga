[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quartus-mcp"
version = "0.1.0"
description = "Quartus Prime deep integration MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
]

[project.scripts]
quartus-mcp = "quartus_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quartus_mcp"]
