# Source-of-truth manifest consumed by tools/gen-skills/generate.py.
# DO NOT hand-edit the generated SKILL.md / command.md / host configs.
#
# waveform-mcp-rs is the unified Rust waveform MCP. It exposes 7 tools:
#   * pure parsing (parse_waveform, extract_signal_events, get_signal_stats, summarize_waveform)
#   * AXI4 5-channel decoder (decode_axi)
#   * RTL source mapping (map_signal_to_rtl)
#   * LLM-backed root-cause analysis (debug_waveform — uses ANTHROPIC_* vars)

mcp_name:  waveform-mcp-rs
binary:    waveform-mcp-rs
transport: stdio

env:
  required: []
  optional:
    - VIBE4FPGA_LLM         # default model key (claude / claude-opus / claude-haiku)
    - ANTHROPIC_API_KEY     # Claude, direct api.anthropic.com (x-api-key)
    - ANTHROPIC_AUTH_TOKEN  # Claude, Bearer-token proxy / OAuth (alternative to API_KEY)
    - ANTHROPIC_BASE_URL    # Claude, override endpoint (for proxies)

skills:
  - id:               waveform_debug
    tool:             debug_waveform
    summary:          "Detect timing anomalies in VCD waveforms (glitches, X/Z states, CDC violations, AXI handshake, stall timeout) and explain root causes with an LLM reasoning pass."
    claude_trigger:   "waveform|vcd|glitch|stall|debug simulation"
    opencode_command: debug-wave
    codex_alias:      dw
