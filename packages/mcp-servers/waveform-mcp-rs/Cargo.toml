[package]
name = "waveform-mcp-rs"
version = "0.3.0"
edition = "2021"
description = "MCP server for VCD/FST waveform analysis, written in Rust. Exposes 7 tools: parse / summarize / extract / get_signal_stats / decode_axi / map_signal_to_rtl / debug_waveform (last is LLM-backed)."
license = "MIT"

[[bin]]
name = "waveform-mcp-rs"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.1", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
vcd = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
walkdir = "2"
