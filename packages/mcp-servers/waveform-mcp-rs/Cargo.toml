[package]
name = "waveform-mcp-rs"
version = "0.1.0"
edition = "2021"
description = "MCP server for VCD/FST waveform file parsing, written in Rust"

[[bin]]
name = "waveform-mcp-rs"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.1", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
vcd = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
