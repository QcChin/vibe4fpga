[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eda-bridge-mcp"
version = "0.1.0"
description = "EDA Tool Control MCP Server (Vivado / Quartus bridge)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.6.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
eda-bridge-mcp = "eda_bridge_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_bridge_mcp"]
