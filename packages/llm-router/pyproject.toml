[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe4fpga-llm-router"
version = "0.1.0"
description = "Unified LLM Router for FPGA Vibe Coding IDE"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "anthropic>=0.25.0",
    "openai>=1.20.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
llm-router = "llm_router.main:start"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router"]

[tool.ruff.lint]
select = ["E", "F", "I"]
