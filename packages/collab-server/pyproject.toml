[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collab-server"
version = "0.1.0"
description = "Team collaboration and shared RAG knowledge base server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "llama-index>=0.10.0",
    "llama-index-vector-stores-qdrant>=0.2.0",
    "qdrant-client>=1.8.0",
    "python-jose[cryptography]>=3.3.0",   # JWT auth
    "passlib[bcrypt]>=1.7.4",
]

[project.scripts]
collab-server = "collab_server.main:start"

[tool.hatch.build.targets.wheel]
packages = ["src/collab_server"]
