[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe4fpga-mcp-testkit"
version = "0.1.0"
description = "Dev-only smoke-test harness for vibe4fpga MCP servers. Not published."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "vibe4fpga contributors" }]
keywords = ["mcp", "testing", "pytest", "vibe4fpga"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

dependencies = [
    "mcp>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vibe4fpga_mcp_testkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
