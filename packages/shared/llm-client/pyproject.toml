[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe4fpga-llm-client"
version = "0.1.0"
description = "Shared LLM adapter library for vibe4fpga MCP servers (Claude / OpenAI / Gemini / DeepSeek / Ollama / RTLCoder)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "vibe4fpga contributors" }]
keywords = ["mcp", "llm", "fpga", "verilog", "claude", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

# Base dependencies = absolute minimum for the registry and Ollama/RTLCoder (httpx-only).
# LLM-vendor SDKs are optional extras so callers only install what they use.
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.25.0"]
openai = ["openai>=1.20.0"]
deepseek = ["openai>=1.20.0"]
gemini = ["google-generativeai>=0.5.0"]
all = [
    "anthropic>=0.25.0",
    "openai>=1.20.0",
    "google-generativeai>=0.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vibe4fpga_llm_client"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
