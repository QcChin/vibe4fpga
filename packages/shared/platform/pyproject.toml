[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe4fpga-platform"
version = "0.1.0"
description = "Cross-platform helpers (paths, tool discovery, subprocess) for vibe4fpga MCP servers."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "vibe4fpga contributors" }]
keywords = ["mcp", "fpga", "cross-platform", "windows", "subprocess"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vibe4fpga_platform"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
